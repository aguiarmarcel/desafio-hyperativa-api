spring.application.name=hyperativa-api

# Server
server.port=8080

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/hyperativa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=hyperativa
spring.datasource.password=hyperativa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.auto-commit=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.user=hyperativa
spring.flyway.password=hyperativa

security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:/Users/marcelaguiar/keys/jwt-public.pem}
security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:/Users/marcelaguiar/keys/jwt-private.pem}
security.jwt.ttl-seconds=900

# Crypto PAN
security.pan.hmac-secret=${PAN_HMAC_SECRET:dev-secret-change-me}
security.pan.aes-key-b64=o0ezco/CrttgQSWiI30dtv90CCg4MSGGtkJAyHvdGss=

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true